    # Nenalet - overeni podezrelych zprav (AI vyzva pro Cesko 2026), pm2 "nenalet" na 127.0.0.1:8011
    location = /nenalet { return 301 /nenalet/; }
    location /nenalet/ {
        proxy_pass http://127.0.0.1:8011/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16m;
        proxy_read_timeout 90s;
        error_page 502 504 = @nenalet_restart_html;
    }
    location /nenalet/api/ {
        proxy_pass http://127.0.0.1:8011/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16m;
        proxy_read_timeout 90s;
        error_page 502 504 = @nenalet_restart_text;
    }
    # Kratky restart pri nasazeni: srozumitelna hlaska misto 502
    location @nenalet_restart_html {
        charset utf-8;
        default_type text/html;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="5"><title>Nenaleť se aktualizuje</title></head><body style="font:18px/1.6 system-ui,sans-serif;max-width:36rem;margin:3rem auto;padding:0 16px;color:#141a2e;background:#f4f6fb"><h1>Nenaleť se právě aktualizuje</h1><p>Za pár sekund bude zase k dispozici. Stránka se obnoví sama.</p></body></html>';
    }
    location @nenalet_restart_text {
        charset utf-8;
        default_type text/plain;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 503 '❔ Nenaleť se právě aktualizuje. Zkuste to prosím za pár sekund znovu.';
    }

