[project]
name = "nenalet"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "c2pa-python>=0.38.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai>=2.52.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "selectolax>=1.0.2",
    "tldextract>=5.4.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
